[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colpali-2-0"
version = "0.1.0"
description = "Local-first PDF to JSON + tabular extraction with layout hierarchy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf==1.24.10",
  "pandas==2.2.2",
  "pydantic==2.8.2",
]

[tool.setuptools.packages.find]
where = ["src"]
